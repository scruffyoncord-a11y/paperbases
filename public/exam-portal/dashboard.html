<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakPrep — Dashboard</title>
    <meta name="description" content="PeakPrep student dashboard for JEE, NEET, BITSAT exam preparation.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
      };
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', system-ui, sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #333942; border-radius: 20px; }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #444b55; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
      /* Exam portal overlay */
      .exam-portal-overlay { position: fixed; inset: 0; z-index: 9999; background: #0B0E14; }
      .exam-portal-overlay iframe { width: 100%; height: 100%; border: none; }
      .exam-portal-back { position: fixed; top: 16px; left: 16px; z-index: 10000; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); color: white; border: 1px solid rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
      .exam-portal-back:hover { background: rgba(37,99,235,0.8); border-color: rgba(37,99,235,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="dashboard-app.js" type="text/babel" data-type="module"></script>
</body>
</html>
